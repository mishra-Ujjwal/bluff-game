services:
  - type: web
    name: bluff-royale-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run prisma:generate
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

  - type: static_site
    name: bluff-royale-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_APP_NAME
        value: Bluff Royale
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
